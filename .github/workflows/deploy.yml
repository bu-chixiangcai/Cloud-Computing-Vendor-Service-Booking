name: CD - Deploy Application

# Reusable workflow (workflow_call) - invoked by ci.yml, but also kept
# independently manually runnable (workflow_dispatch). Never auto-triggered on
# push. Deploying always applies infra first (job `infra` below, which calls
# build.yml) so the `app` job never targets instances/an ASG that don't exist
# yet or are out of date - that's the sequencing this workflow guarantees.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to deploy (branch, tag, or commit SHA)"
        required: false
        default: main
  workflow_call:
    inputs:
      ref:
        description: "Git ref to deploy (branch, tag, or commit SHA)"
        required: false
        type: string
        default: main

env:
  AWS_REGION: us-east-1
  APP_DIR: vendor-services-booking
  ARTIFACT_PREFIX: artifacts
  APP_TAG: assignment-vendor-services-booking

jobs:
  infra:
    name: Apply infrastructure (prerequisite for app deploy)
    uses: ./.github/workflows/build.yml
    with:
      action: apply
    secrets: inherit

  app:
    name: Build & deploy app to ASG instances
    needs: infra
    runs-on: ubuntu-latest
    # Bucket name comes from the infra job's terraform output, not a hardcoded
    # value - keeps this in lockstep with the account-ID-suffixed bucket name.
    env:
      ARTIFACT_BUCKET: ${{ needs.infra.outputs.s3_bucket }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      # AWS Academy Learner Lab credentials expire every ~3-4 hours and rotate
      # per session - refresh these 3 repo secrets before running this workflow.
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Package application
        working-directory: ${{ env.APP_DIR }}
        run: zip -r ../assignment-app.zip . -x "uploads/*"

      - name: Upload artifact to S3
        run: |
          aws s3 cp assignment-app.zip \
            "s3://${{ env.ARTIFACT_BUCKET }}/${{ env.ARTIFACT_PREFIX }}/assignment-app.zip"

      # The other half of the sequencing fix: `terraform apply` in the `infra`
      # job returns as soon as the AWS API calls succeed, not once instances
      # have finished booting and registered with SSM. Poll until at least one
      # is actually reachable before sending the deploy command to it.
      - name: Wait for an SSM-managed running instance
        run: |
          set -euo pipefail

          for i in $(seq 1 40); do
            INSTANCE_IDS=$(aws ec2 describe-instances \
              --filters "Name=tag:App,Values=${{ env.APP_TAG }},vendor-services-booking" "Name=instance-state-name,Values=running" \
              --query "Reservations[].Instances[].InstanceId" --output text)

            if [ -z "$INSTANCE_IDS" ]; then
              echo "Waiting for at least one running EC2 instance (attempt $i/40)..."
            else
              ONLINE_SSM_IDS=$(aws ssm describe-instance-information \
                --query "InstanceInformationList[?PingStatus=='Online'].InstanceId" --output text 2>/dev/null || echo "")

              MATCHED_IDS=""
              for id in $INSTANCE_IDS; do
                if echo " $ONLINE_SSM_IDS " | grep -q " $id "; then
                  MATCHED_IDS="$MATCHED_IDS $id"
                fi
              done
              MATCHED_IDS=$(echo "$MATCHED_IDS" | xargs)

              echo "Attempt $i/40: EC2 running instance(s): $INSTANCE_IDS | SSM online matched: $MATCHED_IDS"

              if [ -n "$MATCHED_IDS" ]; then
                echo "Found SSM-managed online instance(s): $MATCHED_IDS"
                exit 0
              fi
            fi

            sleep 10
          done

          echo "=== DIAGNOSTIC: EC2 describe-instances ==="
          aws ec2 describe-instances \
            --query "Reservations[].Instances[].[InstanceId,State.Name,Tags[?Key=='App'].Value|[0],Tags[?Key=='Name'].Value|[0]]" \
            --output table || true

          echo "=== DIAGNOSTIC: SSM describe-instance-information ==="
          aws ssm describe-instance-information \
            --query "InstanceInformationList[].[InstanceId,PingStatus,LastPingDateTime,AgentVersion]" \
            --output table || true

          echo "=== DIAGNOSTIC: Raw SSM describe-instance-information ==="
          aws ssm describe-instance-information || true

          echo "Timed out waiting for a running, SSM-managed instance."
          exit 1

      - name: Deploy to ASG instances via SSM
        run: |
          set -euo pipefail

          INSTANCE_IDS=$(aws ec2 describe-instances \
            --filters "Name=tag:App,Values=${{ env.APP_TAG }},vendor-services-booking" "Name=instance-state-name,Values=running" \
            --query "Reservations[].Instances[].InstanceId" --output text)

          if [ -z "$INSTANCE_IDS" ]; then
            echo "No running instances found for tag App=${{ env.APP_TAG }}"
            exit 1
          fi

          # Target only instances that are confirmed Online in SSM
          ONLINE_SSM_IDS=$(aws ssm describe-instance-information \
            --query "InstanceInformationList[?PingStatus=='Online'].InstanceId" --output text 2>/dev/null || echo "")

          TARGET_IDS=""
          for id in $INSTANCE_IDS; do
            if echo " $ONLINE_SSM_IDS " | grep -q " $id "; then
              TARGET_IDS="$TARGET_IDS $id"
            fi
          done
          TARGET_IDS=$(echo "$TARGET_IDS" | xargs)

          if [ -z "$TARGET_IDS" ]; then
            echo "No running instances are currently Online in SSM."
            exit 1
          fi

          echo "Deploying to online instance(s): $TARGET_IDS"

          COMMAND_ID=$(aws ssm send-command \
            --document-name "AWS-RunShellScript" \
            --instance-ids $TARGET_IDS \
            --comment "${{ env.APP_TAG }} deploy" \
            --parameters '{"commands":[
              "cloud-init status --wait",
              "aws s3 cp s3://${{ env.ARTIFACT_BUCKET }}/${{ env.ARTIFACT_PREFIX }}/assignment-app.zip /tmp/assignment-app.zip",
              "sudo rm -rf /var/www/html/*",
              "sudo unzip -o /tmp/assignment-app.zip -d /var/www/html",
              "sudo systemctl restart httpd"
            ]}' \
            --query "Command.CommandId" --output text)

          for id in $TARGET_IDS; do
            echo "Waiting for deploy command on instance $id..."
            aws ssm wait command-executed --command-id "$COMMAND_ID" --instance-id "$id"
            aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$id"
          done
